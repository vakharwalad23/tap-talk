[project]
name = "orukeet-lab"
version = "0.1.0"
description = "Conversion and audit tooling for Orukeet Core ML variants"
requires-python = ">=3.12,<3.13"
# Pins mirror the mobius parakeet-tdt-v3-0.6b converter environment the shipped graphs came from,
# on the newest interpreter the machine has.
dependencies = [
    "torch==2.7.0",
    "coremltools==9.0b1",
    "nemo-toolkit[asr]==2.3.1",
    "numpy==1.26.4",
    "protobuf==4.24.4",
    "typer==0.16.0",
    "soundfile==0.13.1",
    "huggingface-hub==0.33.1",
    "transformers==4.51.3",
    "lightning==2.4.0",
    "pytorch-lightning==2.5.2",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "sentencepiece==0.2.0",
    "onnx==1.17.0",
    "scikit-learn==1.5.1",
    "scipy==1.15.3",
    "librosa==0.11.0",
]

[tool.uv]
package = false
