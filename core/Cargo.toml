[package]
name = "tap-talk-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "tap_talk_core"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
whisper-rs = { version = "0.14", features = ["coreml", "metal"] }
cpal = "0.15"
rubato = "0.15"
voice_activity_detector = "0.2"
ureq = "3"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
