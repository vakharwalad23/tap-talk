name: TapTalk
options:
  bundleIdPrefix: talk.tap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  TapTalk:
    type: application
    platform: macOS
    sources:
      - path: TapTalk
        excludes:
          - "Generated/TapTalkCoreFFI.h"
          - "Generated/TapTalkCoreFFI.modulemap"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: talk.tap.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/core/target/release"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/TapTalk/Generated"
        OTHER_LDFLAGS:
          - "-ltap_talk_core"
          - "-lc++"
          - "-framework"
          - "Accelerate"
          - "-framework"
          - "CoreAudio"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreML"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
        SWIFT_INCLUDE_PATHS:
          - "$(PROJECT_DIR)/TapTalk/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: "TapTalk/BridgingHeader.h"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    entitlements:
      path: TapTalk/TapTalk.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    info:
      path: TapTalk/Info.plist
      properties:
        NSMicrophoneUsageDescription: "TapTalk needs microphone access to transcribe your speech locally."
        NSAccessibilityUsageDescription: "TapTalk needs accessibility permission to detect your push-to-talk hotkey globally."
        NSQuitAlwaysKeepsWindows: false
        LSMinimumSystemVersion: "14.0"
