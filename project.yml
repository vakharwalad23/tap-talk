name: TapTalk
options:
  bundleIdPrefix: talk.tap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.17.5"
    traits: []
  OrukeetCoreML:
    path: TapTalk/Vendor/OrukeetCoreML
  TapTalkAudio:
    path: TapTalk/Audio

targets:
  TapTalk:
    type: application
    platform: macOS
    dependencies:
      - package: FluidAudio
      - package: OrukeetCoreML
        product: OrukeetCoreML
      - package: TapTalkAudio
    sources:
      - path: TapTalk
        excludes:
          - "Generated/TapTalkCoreFFI.h"
          - "Generated/TapTalkCoreFFI.modulemap"
          # Local packages compiled via the packages: dependencies above; exclude their dirs so
          # SwiftPM .build output inside them is not swept into the app target (duplicate tasks).
          - "Vendor/OrukeetCoreML"
          - "Audio"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: talk.tap.app
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "8"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/core/target/release"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/TapTalk/Generated"
        OTHER_LDFLAGS:
          - "-ltap_talk_core"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
        SWIFT_INCLUDE_PATHS:
          - "$(PROJECT_DIR)/TapTalk/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: "TapTalk/BridgingHeader.h"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: TapTalk/TapTalk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
    info:
      path: TapTalk/Info.plist
      properties:
        # Sourced from the build settings above so the bundle can never disagree with
        # MARKETING_VERSION. xcodegen regenerates Info.plist, so setting them there is futile.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "TapTalk needs microphone access to transcribe your speech locally."
        NSAccessibilityUsageDescription: "TapTalk needs accessibility permission to detect your push-to-talk hotkey globally."
        NSQuitAlwaysKeepsWindows: false
        LSMinimumSystemVersion: "14.0"
